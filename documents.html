<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documents Vault - Mentor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app-layout">
  <aside id="sidebar">
    <div class="sidebar-brand">
      <i class="bi bi-mortarboard-fill text-primary me-2 fs-4"></i>
      <span>MentorPulse</span>
    </div>
    <ul class="sidebar-menu">
      <li><a href="dashboard.html" class="nav-link"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
      <li><a href="students.html" class="nav-link"><i class="bi bi-people"></i> Students</a></li>
      <li><a href="documents.html" class="nav-link active"><i class="bi bi-file-earmark-lock"></i> Documents Vault</a></li>
      <li><a href="reports.html" class="nav-link"><i class="bi bi-file-bar-graph"></i> Reports</a></li>
      <li><a href="settings.html" class="nav-link"><i class="bi bi-gear"></i> Settings</a></li>
    </ul>
  </aside>

  <main id="main-content">
    <header class="top-navbar">
      <div class="d-flex align-items-center gap-3">
        <button id="sidebar-toggle" class="btn btn-light btn-sm border"><i class="bi bi-list fs-5"></i></button>
        <span class="text-secondary small">Compliance / Document Vault</span>
      </div>
      <button id="theme-toggle" class="btn btn-light btn-sm border rounded-circle"><i class="bi bi-moon-stars"></i></button>
    </header>

    <div class="p-4">
      <div class="mb-4">
        <h4 class="fw-bold mb-0">Document Verification Vault</h4>
        <p class="text-secondary small mb-0">Review student files stored directly on GitHub Repository storage.</p>
      </div>

      <div class="row g-3" id="documents-grid">
        <div class="col-12 text-center text-secondary py-5">Loading vault files from GitHub Repo...</div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/github-sync.js"></script>
<script src="js/app.js"></script>
<script>
  async function renderVaultGrid() {
    const grid = document.getElementById('documents-grid');
    const students = await fetchStudentsFromGitHub();

    if (!students || students.length === 0) {
      grid.innerHTML = '<div class="col-12 text-center text-secondary py-5">No documents uploaded yet.</div>';
      return;
    }

    grid.innerHTML = students.map(s => `
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card-custom">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
              <h6 class="fw-bold mb-0">${s.name}</h6>
              <span class="badge bg-secondary-subtle text-dark">${s.id}</span>
            </div>
            <i class="bi bi-patch-check-fill text-primary fs-5"></i>
          </div>
          <p class="text-secondary small mb-3">Dept: ${s.department || 'N/A'}</p>
          <div class="d-flex gap-2">
            ${s.docUrl ? `<a href="${s.docUrl}" target="_blank" class="btn btn-sm btn-primary w-100"><i class="bi bi-download me-1"></i> View / Download</a>` : '<button class="btn btn-sm btn-light w-100" disabled>No File</button>'}
          </div>
        </div>
      </div>
    `).join('');
  }

  document.addEventListener('DOMContentLoaded', renderVaultGrid);
</script>
</body>
</html>
